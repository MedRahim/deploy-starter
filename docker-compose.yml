services:
  api:
    build: .
    image: deploy-starter:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_VERSION: "1.0.0"
      TRUST_PROXY: "0"
    restart: unless-stopped
    # The API never writes to disk: make that explicit and enforced.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
