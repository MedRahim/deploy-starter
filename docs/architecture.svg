<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">deploy-starter architecture and delivery pipeline</title>
  <desc id="desc">A request goes from client through an optional TLS reverse proxy to an Express API backed by an in-memory store. The API exposes /health, which the container probe calls. Every git push runs tests in GitHub Actions, builds a non-root Docker image and deploys it only if the health check passes.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6b7c8c"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f7f9fb"/>

  <text x="48" y="55" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#10202f">deploy-starter</text>
  <text x="48" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6b7b">One service, one health check, one pipeline — deployable to any VPS or Azure container host.</text>

  <!-- runtime lane -->
  <rect x="32" y="112" width="1136" height="185" rx="12" fill="#f2f7f9" stroke="#dde7ee"/>
  <text x="48" y="140" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" font-weight="700" fill="#0f766e">RUNTIME</text>

  <rect x="48" y="165" width="150" height="78" rx="10" fill="#ffffff" stroke="#c9d6e2"/>
  <text x="123" y="197" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">Client</text>
  <text x="123" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">browser / curl</text>

  <rect x="238" y="165" width="190" height="78" rx="10" fill="#ffffff" stroke="#c9d6e2"/>
  <text x="333" y="197" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">Reverse proxy</text>
  <text x="333" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">TLS · optional</text>

  <rect x="468" y="165" width="220" height="78" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="578" y="197" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">Express API</text>
  <text x="578" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">helmet · rate limit</text>

  <rect x="728" y="165" width="190" height="78" rx="10" fill="#ffffff" stroke="#c9d6e2"/>
  <text x="823" y="197" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">Task store</text>
  <text x="823" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">in-memory Map</text>

  <rect x="958" y="165" width="190" height="78" rx="10" fill="#ffffff" stroke="#c9d6e2"/>
  <text x="1053" y="197" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">/health</text>
  <text x="1053" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">container probe</text>

  <line x1="202" y1="204" x2="232" y2="204" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432" y1="204" x2="462" y2="204" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="692" y1="204" x2="722" y2="204" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1053 165 L1053 145 L578 145 L578 161" fill="none" stroke="#6b7c8c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>
  <text x="815" y="138" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">probe: GET /health</text>

  <text x="578" y="270" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">request id · JSON errors · 10 kb limit</text>
  <text x="823" y="270" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">swap for Postgres, same interface</text>
  <text x="1053" y="270" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">checked every 30 s</text>

  <!-- delivery lane -->
  <rect x="32" y="312" width="1136" height="185" rx="12" fill="#f5f8f3" stroke="#e0e8da"/>
  <text x="48" y="340" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" font-weight="700" fill="#b45309">DELIVERY PIPELINE</text>

  <rect x="48" y="355" width="170" height="78" rx="10" fill="#ffffff" stroke="#d5decf"/>
  <text x="133" y="387" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">git push</text>
  <text x="133" y="409" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">main or pull request</text>

  <rect x="258" y="355" width="230" height="78" rx="10" fill="#ffffff" stroke="#d5decf"/>
  <text x="373" y="387" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">GitHub Actions</text>
  <text x="373" y="409" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">install · check · test · audit</text>

  <rect x="528" y="355" width="200" height="78" rx="10" fill="#ffffff" stroke="#d5decf"/>
  <text x="628" y="387" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">Docker image</text>
  <text x="628" y="409" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">non-root · read-only</text>

  <rect x="768" y="355" width="200" height="78" rx="10" fill="#ffffff" stroke="#d5decf"/>
  <text x="868" y="387" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10202f">VPS or Azure</text>
  <text x="868" y="409" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">health-gated deploy</text>

  <line x1="222" y1="394" x2="252" y2="394" stroke="#b45309" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="492" y1="394" x2="522" y2="394" stroke="#b45309" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <line x1="732" y1="394" x2="762" y2="394" stroke="#b45309" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <text x="373" y="460" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">npm ci · node --test</text>
  <text x="628" y="460" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">smoke test: GET /health</text>
  <text x="868" y="460" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b7c8c">docker compose up -d</text>

  <line x1="48" y1="512" x2="1148" y2="512" stroke="#c9d6e2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="48" y="538" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#5b6b7b">Teal: request path. Amber: delivery pipeline. Dashed: health probe. Nothing reaches a server until the tests and the container smoke test pass.</text>
</svg>
